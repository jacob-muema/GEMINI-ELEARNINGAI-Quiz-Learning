<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
        <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#232F3E"/>
            <stop offset="100%" stop-color="#131A22"/>
        </linearGradient>
        <linearGradient id="awsOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#FF8000"/>
        </linearGradient>
        <filter id="awsGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF9900" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Outer Hexagon Badge -->
    <polygon points="120,12 216,66 216,174 120,228 24,174 24,66" fill="url(#awsBg)" stroke="#FF9900" stroke-width="3" filter="url(#awsGlow)"/>
    <polygon points="120,22 206,71 206,169 120,218 34,169 34,71" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3"/>
    
    <!-- AWS Top Wordmark -->
    <text x="120" y="60" font-family="'Segoe UI', 'Amazon Ember', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">aws</text>
    <!-- AWS Characteristic Smile / Arrow -->
    <path d="M88,68 Q120,86 152,68" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
    <path d="M150,65 L156,68 L148,73 Z" fill="#FF9900"/>
    
    <!-- CERTIFIED Text -->
    <text x="120" y="104" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#FF9900" text-anchor="middle" letter-spacing="2.5">CERTIFIED</text>
    
    <!-- Badge Central Plaque -->
    <rect x="36" y="122" width="168" height="46" rx="6" fill="#1A2430" stroke="#FF9900" stroke-width="1.5"/>
    <text x="120" y="141" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SOLUTIONS ARCHITECT</text>
    <text x="120" y="157" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="10" fill="#FF9900" text-anchor="middle" letter-spacing="1.5">ASSOCIATE</text>
    
    <!-- SAA-C03 Code Badge -->
    <rect x="75" y="186" width="90" height="20" rx="10" fill="#FF9900"/>
    <text x="120" y="200" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#232F3E" text-anchor="middle" letter-spacing="1">SAA-C03</text>
</svg>
