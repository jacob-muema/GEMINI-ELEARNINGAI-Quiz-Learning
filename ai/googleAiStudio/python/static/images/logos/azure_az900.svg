<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
        <linearGradient id="az900Grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0078D4"/>
            <stop offset="100%" stop-color="#002050"/>
        </linearGradient>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#50E6FF"/>
            <stop offset="100%" stop-color="#0078D4"/>
        </linearGradient>
        <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0078D4" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Outer Hexagon Badge -->
    <polygon points="120,12 216,66 216,174 120,228 24,174 24,66" fill="url(#az900Grad)" stroke="#50E6FF" stroke-width="3" filter="url(#badgeGlow)"/>
    <!-- Inner Hexagon border -->
    <polygon points="120,22 206,71 206,169 120,218 34,169 34,71" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    
    <!-- Microsoft Logo 4 Squares at Top -->
    <g transform="translate(111, 38)">
        <rect x="0" y="0" width="8" height="8" fill="#F25022"/>
        <rect x="10" y="0" width="8" height="8" fill="#7FBA00"/>
        <rect x="0" y="10" width="8" height="8" fill="#00A4EF"/>
        <rect x="10" y="10" width="8" height="8" fill="#FFB900"/>
    </g>
    
    <!-- Microsoft Certified Header -->
    <text x="120" y="70" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MICROSOFT CERTIFIED</text>
    
    <!-- Azure Fluid Cloud Glyph -->
    <g transform="translate(86, 78) scale(0.7)">
        <path d="M48.8,12 C35,12 23.5,21.5 20.8,34.5 C10,36.5 2,46 2,57.5 C2,70.5 12.5,81 25.5,81 L72,81 C82.5,81 91,72.5 91,62 C91,52.5 84,44.5 75,43.2 C74.8,26 63.2,12 48.8,12 Z" fill="url(#cloudGrad)"/>
    </g>
    
    <!-- Certification Banner -->
    <rect x="42" y="142" width="156" height="32" rx="6" fill="#001833" stroke="#50E6FF" stroke-width="1.5"/>
    <text x="120" y="157" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#50E6FF" text-anchor="middle" letter-spacing="1">AZURE</text>
    <text x="120" y="169" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">FUNDAMENTALS</text>
    
    <!-- AZ-900 Code Badge -->
    <rect x="75" y="186" width="90" height="20" rx="10" fill="#0078D4"/>
    <text x="120" y="200" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AZ-900 ★</text>
</svg>
