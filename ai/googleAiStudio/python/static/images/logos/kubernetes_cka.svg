<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
        <linearGradient id="k8sBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E3A8A"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="k8sBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60A5FA"/>
            <stop offset="100%" stop-color="#326CE5"/>
        </linearGradient>
        <filter id="k8sGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#326CE5" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- Outer Hexagon Badge -->
    <polygon points="120,12 216,66 216,174 120,228 24,174 24,66" fill="url(#k8sBg)" stroke="#60A5FA" stroke-width="3" filter="url(#k8sGlow)"/>
    <polygon points="120,22 206,71 206,169 120,218 34,169 34,71" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3"/>
    
    <!-- CNCF / Kubernetes Helm Graphic -->
    <g transform="translate(120, 72) scale(0.65)">
        <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#326CE5" stroke="#FFFFFF" stroke-width="4"/>
        <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
        <!-- Spokes -->
        <line x1="0" y1="0" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="0" y1="0" x2="39" y2="-22" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="0" y1="0" x2="39" y2="22" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="0" y1="0" x2="0" y2="45" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="0" y1="0" x2="-39" y2="22" stroke="#FFFFFF" stroke-width="4"/>
        <line x1="0" y1="0" x2="-39" y2="-22" stroke="#FFFFFF" stroke-width="4"/>
    </g>
    
    <!-- KUBERNETES Text -->
    <text x="120" y="122" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">KUBERNETES</text>
    
    <!-- Certification Banner -->
    <rect x="42" y="136" width="156" height="38" rx="6" fill="#0B132B" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="120" y="153" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#60A5FA" text-anchor="middle" letter-spacing="1">ADMINISTRATOR</text>
    <text x="120" y="166" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="8" fill="#93C5FD" text-anchor="middle" letter-spacing="1">LINUX FOUNDATION / CNCF</text>
    
    <!-- CKA Code Badge -->
    <rect x="75" y="186" width="90" height="20" rx="10" fill="#326CE5"/>
    <text x="120" y="200" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CKA ★</text>
</svg>
