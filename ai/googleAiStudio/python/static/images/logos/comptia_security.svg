<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
        <linearGradient id="comptiaShield" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2D3748"/>
            <stop offset="100%" stop-color="#1A202C"/>
        </linearGradient>
        <linearGradient id="comptiaRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E53E3E"/>
            <stop offset="100%" stop-color="#C53030"/>
        </linearGradient>
        <filter id="comptiaGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E53E3E" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- Outer Shield -->
    <path d="M120,12 C180,12 216,36 216,96 C216,160 160,208 120,228 C80,208 24,160 24,96 C24,36 60,12 120,12 Z" fill="url(#comptiaShield)" stroke="#E53E3E" stroke-width="3" filter="url(#comptiaGlow)"/>
    <path d="M120,22 C172,22 204,44 204,96 C204,152 154,196 120,214 C86,196 36,152 36,96 C36,44 68,22 120,22 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3"/>
    
    <!-- CompTIA Header Text -->
    <text x="120" y="58" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#E53E3E" text-anchor="middle" letter-spacing="2">CompTIA</text>
    
    <!-- Security Shield Icon -->
    <g transform="translate(98, 72)">
        <path d="M22,4 C34,4 40,10 40,22 C40,36 30,48 22,54 C14,48 4,36 4,22 C4,10 10,4 22,4 Z" fill="url(#comptiaRed)"/>
        <!-- Lock Keyhole -->
        <circle cx="22" cy="24" r="5" fill="#FFFFFF"/>
        <polygon points="20,25 24,25 25,36 19,36" fill="#FFFFFF"/>
    </g>
    
    <!-- Certification Banner -->
    <rect x="42" y="142" width="156" height="32" rx="6" fill="#171923" stroke="#E53E3E" stroke-width="1.5"/>
    <text x="120" y="158" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SECURITY<tspan fill="#E53E3E">+</tspan></text>
    <text x="120" y="169" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="8" fill="#A0AEC0" text-anchor="middle" letter-spacing="1">ISO/IEC 17024 ACCREDITED</text>
    
    <!-- SY0-701 Code Badge -->
    <rect x="75" y="186" width="90" height="20" rx="10" fill="#E53E3E"/>
    <text x="120" y="200" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SY0-701</text>
</svg>
